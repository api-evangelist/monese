name: Monese
description: 'Monese is a London-founded fintech that provides mobile money accounts
  to consumers across Europe. Operating as a licensed Electronic Money Institution
  (EMI) rather than a traditional bank, Monese lets over two million users open an
  account in minutes and then spend, send, and save money directly from a smartphone
  app. Its product surface covers multi-currency and local accounts, international
  money transfers, physical and virtual debit cards, budgeting and savings tools,
  and credit-building features. Monese is a consumer-facing mobile application and
  does not publish a public developer API, developer portal, or API documentation
  as of this enrichment pass.'
